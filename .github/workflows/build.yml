name: Build BiliMusic Windows Client

on:
  push:
    branches: [ main ]  # 推送代码到 main 分支时触发
  pull_request:
    branches: [ main ]  # PR 到 main 分支时触发
  workflow_dispatch:    # 手动触发选项
    inputs:
      build-type:
        description: 'Build type (e.g., release, debug)'
        required: false
        default: 'release'

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 环境

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # 检出代码

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # 使用 Node.js 18

      - name: Install dependencies
        run: npm install  # 安装项目依赖

      - name: Build for Windows
        run: npm run build:win  # 构建 Windows 客户端

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliMusic-Windows
          path: dist/  # 假设构建输出在 dist 目录
